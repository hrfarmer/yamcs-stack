name: Yamcs stack

on:
  pull_request:
    paths:
      - "server/**"
      - "client/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "client/**"
      - ".github/workflows/**"

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6

      - name: Unit tests and formatting
        run: |
          make test
          make fmt

      - name: Build and boot Yamcs
        run: |
          make yamcs-build-check INPUT_DIR=tests/fixtures/proves

      - name: Capture container logs
        if: failure()
        run: |
          mkdir -p runtime
          docker compose ps > runtime/compose-ps.txt 2>&1 || docker-compose ps > runtime/compose-ps.txt 2>&1 || true
          docker compose logs --no-color > runtime/compose.log 2>&1 || docker-compose logs --no-color > runtime/compose.log 2>&1 || true

      - name: Stop Yamcs
        if: always()
        run: docker compose down --remove-orphans || docker-compose down --remove-orphans || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: yamcs-server-diagnostics
          path: |
            server/runtime/compose-ps.txt
            server/runtime/compose.log
          if-no-files-found: ignore
          retention-days: 7

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v6

      - name: Unit tests and formatting
        run: |
          make test
          make fmt
