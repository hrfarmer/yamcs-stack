name: Yamcs stack

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6

      - name: Unit tests and formatting
        run: |
          make test
          make fmt

      - name: Build and boot Yamcs
        run: |
          make yamcs-build-check INPUT_DIR=tests/fixtures/proves

      - name: Capture container logs
        if: failure()
        run: |
          mkdir -p runtime
          docker compose ps > runtime/compose-ps.txt 2>&1 || docker-compose ps > runtime/compose-ps.txt 2>&1 || true
          docker compose logs --no-color > runtime/compose.log 2>&1 || docker-compose logs --no-color > runtime/compose.log 2>&1 || true

      - name: Stop Yamcs
        if: always()
        run: docker compose down --remove-orphans || docker-compose down --remove-orphans || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: yamcs-server-diagnostics
          path: |
            server/runtime/compose-ps.txt
            server/runtime/compose.log
          if-no-files-found: ignore
          retention-days: 7

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v6

      - name: Unit tests and formatting
        run: |
          make test
          make fmt

  e2e-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git python3-venv default-jdk maven

      - name: Full-stack F´ + Yamcs + GS client simulation
        run: |
          chmod +x scripts/run_e2e_sim.sh
          scripts/run_e2e_sim.sh

      - name: Upload e2e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-sim-logs
          path: |
            .e2e/logs/
          if-no-files-found: ignore
          retention-days: 7
