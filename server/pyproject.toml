[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proves-yamcs-server"
version = "0.1.0"
description = "Central Yamcs server and multi-ground-station gateway for PROVES"
requires-python = ">=3.13"
dependencies = [
    "fprime-xtce==0.1.2",
    "fprime-yamcs==0.1.3",
    "yamcs-client==1.12.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.12,<0.13",
]

[project.scripts]
proves-yamcs-prepare = "proves_yamcs.prepare:main"
proves-yamcs-supervisor = "proves_yamcs.supervisor:main"
proves-yamcs-gateway = "proves_yamcs.gateway:main"

[tool.hatch.build.targets.wheel]
packages = ["src/proves_yamcs"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
filterwarnings = [
    "ignore::DeprecationWarning:yamcs\\..*",
    "ignore::DeprecationWarning:google\\.protobuf\\..*",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
