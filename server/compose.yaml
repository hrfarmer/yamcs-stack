name: proves-yamcs

services:
  yamcs:
    image: proves-yamcs:5.12.8
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    user: "${YAMCS_UID:-1000}:${YAMCS_GID:-1000}"
    ports:
      - "8090:8090"
      # Per-deployment TM UDP ports are added by runtime/compose.udp.yaml
      # (generated by proves-yamcs-prepare). GS clients talk to gateway :51000.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./runtime/config:/yamcs-config:ro
      - ./runtime/data:/yamcs-data
      - ./runtime/cache:/yamcs-cache
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,size=64m,mode=1777

  grafana:
    image: grafana/grafana:13.0.7
    restart: unless-stopped
    depends_on:
      - yamcs
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_INSTALL_PLUGINS: jaops-yamcs-app
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./runtime/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./runtime/grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s

volumes:
  grafana-data:
